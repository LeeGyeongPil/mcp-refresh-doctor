# 키·계정·네트워크 없이 연습용 목(mock)을 in-process 로 돌려 전체 흐름을 검증한다(Node.js·TypeScript).
# 단위·in-process 시험은 소켓·자식 프로세스·실시간 대기를 쓰지 않는다(쓰면 가드가 바로 실패시킨다).
# 실 소켓 e2e(`npm run test:e2e`)는 여기서 돌리지 않는다 — 로컬·QA 참고용.
# 단계 이름만 봐도 설치·빌드·시험·데모 중 어디서 멈췄는지 알 수 있고,
# 실행 결과에 단계가 하나도 없으면 job 이 시작조차 되지 않은 것(레포 밖 원인)이다.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash # GitHub 의 bash 는 -eo pipefail: tee 앞 명령의 실패가 묻히지 않는다
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Show environment
        timeout-minutes: 1
        run: node --version; npm --version; uname -srm; echo "cpus=$(nproc)" || true
      - name: Install (npm ci)
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Build CLI (tsc)
        timeout-minutes: 2
        run: npm run build
      - name: Build tests (tsc)
        timeout-minutes: 2
        run: npm run build:test
      - name: Unit and in-process tests (no sockets)
        timeout-minutes: 3
        run: npm run test:ci 2>&1 | tee test-output.tap
      - name: Offline demo (in-process mock)
        timeout-minutes: 1
        run: node dist/cli.js demo --lang en
      - name: Explain a failure
        if: failure()
        timeout-minutes: 1
        run: |
          # 어떤 경우에도 0 으로 끝난다 — 이 단계가 새 실패 원인이 되지 않게
          if [ -f test-output.tap ]; then
            grep -n "not ok" test-output.tap | head -n 20 | while IFS= read -r l; do echo "::error title=failed test::$l"; done || true
            { echo "## Failed tests (TAP)"; echo '```'; grep -n -A 30 "not ok" test-output.tap | head -n 300; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No test output: the failure happened before tests (see the failed step name)."
          fi
          for log in "$HOME"/.npm/_logs/*-debug-0.log; do [ -f "$log" ] && tail -n 40 "$log"; done || true
