# 키·계정·네트워크 없이 연습용 목(mock) 서버(127.0.0.1)로 전체 흐름을 검증한다(Node.js·TypeScript).
# 실패하면 단계 이름만 보고도 어디서 멈췄는지(설치·빌드·테스트·데모) 알 수 있게 단계를 나눴고,
# 실패한 테스트는 GitHub 주석(annotation)으로도 남는다 — 로그를 내려받지 않아도 실행 요약과 `gh run view` 에 보인다.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 — 의존성·런타임이 바뀌어 깨지지 않았는지 정기 확인
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # 매달린 테스트가 기본 6시간을 잡아먹지 않게 상한을 둔다(평소 1분 안쪽)
    timeout-minutes: 15
    strategy:
      # 한 버전이 실패해도 나머지를 끝까지 돌린다 — "특정 버전 문제"인지 "환경 문제"인지 가를 수 있다
      fail-fast: false
      matrix:
        # package.json engines(>=20)의 최소 버전 + 지원 중인 LTS 22·24·26(nodejs.org 일정, 2026-11-24 확인)
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          # 개발 의존성이 3개뿐이라 npm 캐시는 쓰지 않는다(캐시 서비스 문제가 CI 실패로 번지지 않게)
      - name: Show environment
        run: |
          node --version
          npm --version
          uname -srm
          grep PRETTY_NAME /etc/os-release || true
          echo "cpus=$(nproc) LANG=${LANG:-unset} LC_ALL=${LC_ALL:-unset}"
      - name: Install dev dependencies (npm ci)
        run: npm ci
      - name: Type-check and build the CLI (tsc)
        run: npm run build
      - name: Build the tests (tsc)
        run: npm run build:test
      - name: Run tests
        # `npm test` 의 마지막 단계와 같은 명령 + 실패한 테스트를 주석으로 남기는 reporter(.github/test-annotations.mjs)
        timeout-minutes: 10
        run: >-
          node --test --test-timeout=120000
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./.github/test-annotations.mjs --test-reporter-destination=stdout
          dist-test/test/*.test.js
      - name: Run the offline demo
        run: node dist/cli.js demo
      - name: Explain a failure
        if: failure()
        run: |
          echo "A step above failed; its name tells which part: install, build, tests or demo."
          echo "Failed tests are also listed as annotations on the run summary page."
          ls -la dist dist-test/test 2>/dev/null || true
          # npm 로그 파일 이름은 시각으로 시작하므로 글롭 정렬의 마지막이 가장 최근 로그다
          last=""
          for log in "$HOME"/.npm/_logs/*-debug-0.log; do last="$log"; done
          if [ -f "$last" ]; then echo "--- last lines of $last"; tail -n 40 "$last"; fi
